name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/otm/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Build Python package
        run: pip install build && python -m build
      - name: Build extensions
        run: python scripts/build_extension.py
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/extension/*.zip
