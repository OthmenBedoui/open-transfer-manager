name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link (if it is about one download)
      description: Only if you are comfortable sharing it.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `otm doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser (if it is about the extension)
      options: ["-", Chrome, Brave, Edge, Opera, Vivaldi, Firefox, Other]
