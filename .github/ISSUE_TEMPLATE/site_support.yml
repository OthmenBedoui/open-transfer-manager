name: Video site does not work
description: A video or audio page cannot be downloaded
labels: [video-site]
body:
  - type: markdown
    attributes:
      value: |
        First try **Settings → Video & audio → Update now** (or `otm update-ytdlp`): sites change often and most problems are fixed by updating yt-dlp.
        If the site is not supported by yt-dlp at all, please report it to https://github.com/yt-dlp/yt-dlp.
  - type: input
    id: url
    attributes:
      label: Page link
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message shown in the app
  - type: textarea
    id: doctor
    attributes:
      label: Output of `otm doctor`
      render: text
    validations:
      required: true
