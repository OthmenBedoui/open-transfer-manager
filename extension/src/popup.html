<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Transfer Manager</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" width="24" height="24" alt="">
    <div class="brand">
      <strong>Open Transfer Manager</strong>
      <span id="status" class="muted">Connecting…</span>
    </div>
    <label class="switch" title="Capture browser downloads">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <div id="problem" class="problem" hidden>
    <p id="problem-text"></p>
    <a id="problem-help" href="#" target="_blank" rel="noopener">How to fix</a>
  </div>

  <section class="page">
    <div id="page-host" class="muted ellipsis"></div>
    <div class="row">
      <button id="send-page" class="accent grow">Download video from this page</button>
      <select id="quality" title="Quality">
        <option value="best">Best</option>
        <option value="2160">4K</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="audio">Audio</option>
      </select>
    </div>
    <div id="page-result" class="muted small"></div>
  </section>

  <section>
    <div class="section-title">
      <span>Downloads</span>
      <span id="total-rate" class="muted"></span>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="muted empty" hidden>No downloads yet.</p>
  </section>

  <footer>
    <button id="open-app">Open app</button>
    <button id="options" class="icon" title="Settings">⚙ Settings</button>
  </footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
