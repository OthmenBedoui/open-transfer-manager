[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open-transfer-manager"
dynamic = ["version"]
description = "A light, open-source download manager for Linux and macOS: multi-connection downloads, video from 1000+ sites (yt-dlp) and browser integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Open Transfer Manager contributors" }]
keywords = ["download manager", "downloader", "yt-dlp", "youtube", "linux", "macos", "accelerator", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/OthmenBedoui/open-transfer-manager"
Issues = "https://github.com/OthmenBedoui/open-transfer-manager/issues"

[project.scripts]
otm = "otm.cli:main"
otm-native-host = "otm.native_host:main"

[tool.setuptools.dynamic]
version = { attr = "otm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otm = ["assets/*"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N"]
ignore = ["E731", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/otm/ui/icons.py" = ["N802", "N806"]   # short P()/L helpers keep the drawing code readable
